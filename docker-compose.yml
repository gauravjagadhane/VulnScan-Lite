services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vulnscan
      POSTGRES_USER: vulnscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnscan_dev_password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnscan -d vulnscan"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vulnscan:${POSTGRES_PASSWORD:-vulnscan_dev_password}@postgres:5432/vulnscan
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vulnscan:${POSTGRES_PASSWORD:-vulnscan_dev_password}@postgres:5432/vulnscan
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend: {condition: service_started}
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: http://localhost:8000}
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
