services:
  - type: web
    name: vulnscan-lite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vulnscan-lite-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vulnscan-lite-queue
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: REQUEST_TIMEOUT_SECONDS
        value: "12"
      - key: MAX_RESPONSE_BYTES
        value: "1000000"
      - key: MAX_REDIRECTS
        value: "3"
      - key: MAX_CONCURRENT_SCANS
        value: "3"
      - key: SCANS_PER_HOUR
        value: "10"

  - type: worker
    name: vulnscan-lite-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app.celery_app worker --loglevel=INFO
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vulnscan-lite-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vulnscan-lite-queue
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: vulnscan-lite-api
          type: web
          envVarKey: SECRET_KEY
      - key: REQUEST_TIMEOUT_SECONDS
        value: "12"
      - key: MAX_RESPONSE_BYTES
        value: "1000000"
      - key: MAX_REDIRECTS
        value: "3"

  - type: keyvalue
    name: vulnscan-lite-queue
    ipAllowList: []

databases:
  - name: vulnscan-lite-db
    databaseName: vulnscan
    user: vulnscan
